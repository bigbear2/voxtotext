# F-DROID metadata — da copiare in un fork di https://github.com/f-droid/fdroiddata
# dentro metadata/com.bigbear2.voxtotext.yml (quando il repo ha un tag di release).

Categories:
  - Office
License: MIT
WebSite: https://github.com/bigbear2/voxtotext
SourceCode: https://github.com/bigbear2/voxtotext
IssueTracker: https://github.com/bigbear2/voxtotext/issues
Changelog: https://github.com/bigbear2/voxtotext/releases
Name: VoxToText
AutoName: VoxToText
Summary: Transcribe WhatsApp/Telegram voice notes to text
Description: |
  VoxToText receives voice notes (.opus) shared from WhatsApp or Telegram and
  transcribes them to text using the Groq API (Whisper large-v3).

  It integrates with the Android share sheet, includes a built-in audio player
  (reliable playback on Xiaomi/MIUI devices), a local history and 12 localized
  languages. You need your own free Groq API key, set from the in-app Settings.
AntiFeatures:
  - NonFreeNet
RequiresRoot: 'No'
MinimalVersion: '21'
CurrentVersion: '1.0.0'
CurrentVersionCode: '1'
Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - windows
      - linux
      - macos
      - web
    build:
      - export FLUTTER_ROOT=/tmp/flutter
      - cd /tmp
      - wget -qO- https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | grep -A1 '"stable"' | head -2 > /dev/null
      - echo "Usa un tag di release e il flutter-builder F-DROID (vedi note)"
      - cd /build/source
      - flutter pub get
      - flutter build apk --release
