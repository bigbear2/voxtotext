name: voxtotext
description: "Trascrizione vocali WhatsApp e Telegram in testo"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  path_provider: ^2.1.6
  share_handler: ^0.0.25
  sqflite: ^2.4.3
  path: ^1.9.1
  just_audio: ^0.10.6
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true